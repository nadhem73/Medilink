# =============================================================================
# MediLink Tunisia — Docker Compose (Monitoring Stack Only)
# =============================================================================
# This compose file runs Prometheus + Grafana alongside existing services.
# It is referenced by the root docker-compose.yml; use that for full stack.
# For standalone monitoring: docker compose -f deploy/docker-compose.yml up -d
# =============================================================================

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: medilink-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - medilink-net

  grafana:
    image: grafana/grafana:latest
    container_name: medilink-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=medilink2025
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    restart: unless-stopped
    depends_on:
      - prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - medilink-net

volumes:
  prometheus-data:
  grafana-data:

networks:
  medilink-net:
    name: medilink-network
    driver: bridge