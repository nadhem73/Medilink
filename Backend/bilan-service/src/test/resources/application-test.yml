spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    database-platform: org.hibernate.dialect.H2Dialect
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

jwt:
  secret: testSecretKeyForMediLinkTunisia2025JWTTokenGenerationAndValidation
  expiration: 900000
  refresh-expiration: 604800000

app:
  ai-service:
    url: http://localhost:8093
  image-storage:
    path: ./target/test-uploads/bilans

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

logging:
  level:
    com.medilinktunisia: DEBUG

server:
  port: 0
