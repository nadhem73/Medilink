spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  cloud:
    config:
      enabled: false
eureka:
  client:
    enabled: false
jwt:
  secret: test-secret-key-for-unit-testing-only-must-be-at-least-256-bits-long
