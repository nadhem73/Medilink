name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('Backend/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Build and test all services
        shell: bash
        run: |
          services=(
            config-server eureka-service api-gateway auth-service
            patient-service doctor-service pharmacy-service bilan-service
          )
          for service in "${services[@]}"; do
            echo "::group::Building and testing $service"
            (cd "$service" && mvn clean verify --no-transfer-progress)
            echo "::endgroup::"
          done
        env:
          SPRING_PROFILES_ACTIVE: test
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: Backend/*/target/*.jar
          retention-days: 7
          if-no-files-found: warn

  ai-service:
    name: AI Service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/ai-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock httpx
      - name: Run tests
        run: pytest tests/ -v

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/medilink-angular
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/medilink-angular/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run ESLint
        run: npm run lint
      - name: Build Angular app
        run: npm run build -- --configuration production
      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
        continue-on-error: true
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medilink-angular-dist
          path: Frontend/medilink-angular/dist/
          retention-days: 7
          if-no-files-found: warn

  mobile-app:
    name: Mobile App (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile App
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Mobile App/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npx jest --no-cache
